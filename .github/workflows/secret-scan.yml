# S1 P0-6 (T011): enforce the repo-local secret gate on push/PR.
# Runs plain Node — no gitleaks binary required (revisit if runner images change).
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan tracked files for real-looking secrets
        run: node scripts/scan-secrets.mjs
